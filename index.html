<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salary & Multi Loan Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1d2433}header{background:#172033;color:#fff;padding:20px;text-align:center}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;font-size:13px;opacity:.8}.container{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{flex:1;border:0;border-radius:10px;padding:14px;background:#e8edf5;font-weight:bold;cursor:pointer}.tab.active{background:#172033;color:#fff}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;padding:17px;border-radius:14px;box-shadow:0 2px 8px #0000000c}.card label{font-size:12px;color:#667085}.card strong{display:block;font-size:22px;margin-top:7px}.panel{margin-bottom:18px}.panel h2{margin:0 0 15px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:9px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:11px 15px;border:0;border-radius:9px;background:#172033;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#e8edf5;color:#172033}.danger{background:#d92d20}.tablewrap{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{background:#f8fafc}.loanItem{border-left:4px solid #172033;margin:10px 0}.small{font-size:13px;color:#667085}@media(max-width:750px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.cards,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>💰 Salary & Multi-Loan Tracker</h1><p>Cloud sync with Google Sheets</p></header>
<div class="container">
<div class="tabs"><button class="tab active" onclick="tab('salary',this)">💼 Salary</button><button class="tab" onclick="tab('loans',this)">🏦 Loans & EMI</button></div>

<section id="salary" class="page active">
<div class="cards"><div class="card"><label>Total Salary</label><strong id="totalSalary">₹0</strong></div><div class="card"><label>Payments</label><strong id="salaryCount">0</strong></div><div class="card"><label>Average</label><strong id="avgSalary">₹0</strong></div><div class="card"><label>Latest</label><strong id="latestSalary">₹0</strong></div></div>
<div class="panel"><h2>➕ Add Salary</h2><div class="grid"><input type="month" id="salMonth"><input id="company" placeholder="Company"><input type="number" id="salAmount" placeholder="Salary amount"><input id="salRemarks" placeholder="Remarks"></div><div class="actions"><button class="btn" onclick="addSalary()">Save Salary</button></div></div>
<div class="panel"><h2>📋 Salary History</h2><div class="actions"><select id="companyFilter" onchange="renderSalary()"><option value="">All Companies</option></select><button class="btn secondary" onclick="clearCompany()">Clear Filter</button></div><div class="tablewrap"><table><thead><tr><th>Month</th><th>Company</th><th>Amount</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="salaryBody"></tbody></table></div></div>
</section>

<section id="loans" class="page">
<div class="cards"><div class="card"><label>Total Borrowed</label><strong id="totalBorrowed">₹0</strong></div><div class="card"><label>Total Paid</label><strong id="totalPaid">₹0</strong></div><div class="card"><label>Total Balance</label><strong id="totalBalance">₹0</strong></div><div class="card"><label>Active Loans</label><strong id="loanCount">0</strong></div></div>
<div class="panel"><h2>➕ Add New Loan</h2><div class="grid"><input id="loanName" placeholder="Loan name"><input type="number" id="loanAmount" placeholder="Initial amount"><input id="loanRemarks" placeholder="Remarks"></div><div class="actions"><button class="btn" onclick="addLoan()">Add Loan</button></div></div>
<div class="panel"><h2>🏦 My Loans</h2><div id="loanCards"></div></div>
<div class="panel"><h2>➕ Add EMI / Payment</h2><div class="grid"><select id="emiLoan"></select><input type="month" id="emiMonth"><input type="number" id="emiAmount" placeholder="Amount paid"><input id="emiRemarks" placeholder="Remarks"></div><div class="actions"><button class="btn" onclick="addEmi()">Save Payment</button></div></div>
<div class="panel"><h2>📋 Payment History</h2><div class="actions"><select id="loanFilter" onchange="renderLoans()"><option value="">All Loans</option></select></div><div class="tablewrap"><table><thead><tr><th>Sr</th><th>Loan</th><th>Month</th><th>Paid</th><th>Balance</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="emiBody"></tbody></table></div></div>
</section>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwPG_wCFCqt3FIgv8Nn6WFM2hGv1uFMEZevh6_lOhR8rKcnm5QapC1bU3XThYBK8XpAAw/exec";
let salary=[],loans=[],payments=[];
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const month=m=>{if(!m)return"";let [y,mo]=m.split("-");return new Date(y,mo-1,1).toLocaleDateString("en-US",{month:"short",year:"2-digit"})};
function tab(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");b.classList.add("active")}
async function api(action,data={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})});const d=await r.json();if(!d.success)throw new Error(d.error);return d}
async function load(){if(API_URL.includes("PASTE_"))return alert("Paste your Google Apps Script Web App URL in index.html first.");try{const r=await fetch(API_URL);const d=await r.json();if(!d.success)throw Error(d.error);salary=d.salary||[];loans=d.loans||[];payments=d.emi||[];renderSalary();renderLoans()}catch(e){alert("Cloud connection error: "+e.message)}}
async function addSalary(){let d={month:salMonth.value,company:company.value.trim(),amount:+salAmount.value,remarks:salRemarks.value.trim()};if(!d.month||!d.company||!d.amount)return alert("Enter month, company and amount");await api("save_salary",{data:d});salAmount.value="";salRemarks.value="";load()}
function renderSalary(){let f=companyFilter.value,data=salary.filter(x=>!f||x.company===f);salaryBody.innerHTML=data.map(x=>`<tr><td>${month(x.month)}</td><td>${x.company}</td><td>${money(x.amount)}</td><td>${x.remarks||"-"}</td><td><button class="btn danger" onclick="delSalary('${x.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="5">No salary records</td></tr>';let total=data.reduce((s,x)=>s+x.amount,0);totalSalary.textContent=money(total);salaryCount.textContent=data.length;avgSalary.textContent=money(data.length?total/data.length:0);latestSalary.textContent=money(data.length?data[data.length-1].amount:0);companyFilter.innerHTML='<option value="">All Companies</option>'+[...new Set(salary.map(x=>x.company))].map(x=>`<option ${x===f?"selected":""}>${x}</option>`).join("")}
function clearCompany(){companyFilter.value="";renderSalary()}async function delSalary(id){if(confirm("Delete salary?")){await api("delete_salary",{id});load()}}
async function addLoan(){let d={name:loanName.value.trim(),initial:+loanAmount.value,remarks:loanRemarks.value.trim()};if(!d.name||!d.initial)return alert("Enter loan name and amount");await api("save_loan",{data:d});loanName.value=loanAmount.value=loanRemarks.value="";load()}
function paid(id){return payments.filter(p=>p.loanId===id).reduce((s,p)=>s+p.amount,0)}function balance(id){let l=loans.find(x=>x.id===id);return Math.max(0,(l?.initial||0)-paid(id))}
function renderLoans(){totalBorrowed.textContent=money(loans.reduce((s,l)=>s+l.initial,0));totalPaid.textContent=money(payments.reduce((s,p)=>s+p.amount,0));totalBalance.textContent=money(loans.reduce((s,l)=>s+balance(l.id),0));loanCount.textContent=loans.length;
loanCards.innerHTML=loans.map(l=>`<div class="card loanItem"><strong>${l.name}</strong><p class="small">Initial: ${money(l.initial)} &nbsp; | &nbsp; Paid: ${money(paid(l.id))} &nbsp; | &nbsp; Balance: <b>${money(balance(l.id))}</b></p><button class="btn danger" onclick="delLoan('${l.id}')">Delete Loan</button></div>`).join("")||"No loans added.";
let selected=emiLoan.value;emiLoan.innerHTML='<option value="">Select Loan</option>'+loans.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");if([...emiLoan.options].some(o=>o.value===selected))emiLoan.value=selected;
let f=loanFilter.value;loanFilter.innerHTML='<option value="">All Loans</option>'+loans.map(l=>`<option value="${l.id}" ${l.id===f?"selected":""}>${l.name}</option>`).join("");
let data=payments.filter(p=>!f||p.loanId===f).sort((a,b)=>a.month.localeCompare(b.month));emiBody.innerHTML=data.map((p,i)=>{let l=loans.find(x=>x.id===p.loanId);let before=payments.filter(x=>x.loanId===p.loanId&&(x.month<p.month||(x.month===p.month&&String(x.id)<=String(p.id)))).reduce((s,x)=>s+x.amount,0);return `<tr><td>${i+1}</td><td>${l?.name||"Loan"}</td><td>${month(p.month)}</td><td>${money(p.amount)}</td><td>${money(Math.max(0,(l?.initial||0)-before))}</td><td>${p.remarks||"-"}</td><td><button class="btn danger" onclick="delEmi('${p.id}')">Delete</button></td></tr>`}).join("")||'<tr><td colspan="7">No payments</td></tr>'}
async function addEmi(){let d={loanId:emiLoan.value,month:emiMonth.value,amount:+emiAmount.value,remarks:emiRemarks.value.trim()};if(!d.loanId||!d.month||!d.amount)return alert("Select loan, month and amount");await api("save_emi",{data:d});emiAmount.value=emiRemarks.value="";load()}
async function delEmi(id){if(confirm("Delete payment?")){await api("delete_emi",{id});load()}}async function delLoan(id){if(confirm("Delete loan and its payments?")){await api("delete_loan",{id});load()}}
load();
</script></body></html>
